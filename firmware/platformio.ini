; Blip — ESP32 firmware for the Ai-Thinker RD-03D radar with a phone web UI
; Required Notice: Copyright Matthew Armstrong (https://github.com/The-Dorkknight)
; Licensed under the PolyForm Noncommercial License 1.0.0. No warranty.
;
; Two boards, one source tree. Pick the env that matches the board you plug in:
;   pio run -e c3-supermini -t upload
;   pio run -e s3-pico      -t upload
; (or double-click Blip-Linux.sh / Blip-Windows.bat / Blip-Mac.command and use the Flash tab)

[platformio]
default_envs = c3-supermini
src_dir = src
include_dir = include

[env]
; pioarduino = Arduino-ESP32 core 3.x (needed for ESP_I2S, ADC DMA). Pinned so
; a future platform release can't change the build under you.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Libraries straight from GitHub tags (works even when the PlatformIO registry is unreachable)
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.11.2
    https://github.com/olikraus/U8g2_Arduino.git#2.36.18
build_flags =
    '-DBLIP_VERSION="0.2.2-wip"'
    -DCORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------------
; ESP32-C3 Super Mini (the little 13-pin board, native USB-C on the C3 itself)
; Radar TX -> GPIO20 (RX), Radar RX -> GPIO21 (TX), OLED SDA GPIO6, SCL GPIO7,
; stetho IF input on GPIO1 (ADC1_CH1). Audio out: I2S amp BCLK GPIO3, WS GPIO4,
; DIN GPIO5; earphone delta-sigma (PDM) on GPIO10 (PDM clock also on GPIO3).
; ---------------------------------------------------------------------------
[env:c3-supermini]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 2MB
board_build.partitions = partitions_2mb.csv ; 2 MB image: boots on any board with >= 2 MB flash
build_flags =
    ${env.build_flags}
    '-DBLIP_BOARD="ESP32-C3 Super Mini"'
    '-DBLIP_BOARD_ID="c3"'
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_RADAR_RX=20
    -DPIN_RADAR_TX=21
    -DPIN_OLED_SDA=6
    -DPIN_OLED_SCL=7
    -DPIN_STETHO_I=1
    -DPIN_I2S_BCLK=3
    -DPIN_I2S_WS=4
    -DPIN_I2S_DOUT=5
    -DPIN_PDM_OUT=10
    -DPIN_STATUS_LED=8
    -DSTATUS_LED_INVERTED=1

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Pico (Pico-shaped, CH343 USB-UART, 2 MB PSRAM, 16 MB flash); any S3 with >= 2 MB flash boots it.
; The log goes to UART0 (CH343) and is copied to the S3's own USB port, so boards without a CH343 show it too.
; Pico-position GP0/GP1 = ESP32 GPIO11/GPIO12 (Waveshare's own UART demo),
; Pico-position GP6/GP7 = GPIO17/GPIO18 (Waveshare's own I2C OLED demo),
; stetho IF input on GPIO7 (ADC1_CH6, Pico-position A1).
; Audio out: I2S amp BCLK GPIO13 (GP2), WS GPIO14 (GP3), DIN GPIO15 (GP4);
; earphone delta-sigma (PDM) on GPIO16 (GP5).
; ---------------------------------------------------------------------------
; Flash: built as a 2 MB image (DIO, 1.875 MB app, no OTA, partitions_2mb.csv) so it
; boots on any S3 with >= 2 MB flash; bigger chips just leave the rest unused. (Was
; 16 MB/QIO until 2026-11-13: a 4 MB S3 then refused to start, "Detected size(4096k)
; smaller than the size in the binary image header(16384k)".)
[env:s3-pico]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 2MB
board_build.partitions = partitions_2mb.csv
build_flags =
    ${env.build_flags}
    '-DBLIP_BOARD="Waveshare ESP32-S3-Pico"'
    '-DBLIP_BOARD_ID="s3"'
    -DBOARD_HAS_PSRAM
    -DPIN_RADAR_RX=12
    -DPIN_RADAR_TX=11
    -DPIN_OLED_SDA=17
    -DPIN_OLED_SCL=18
    -DPIN_STETHO_I=7
    -DPIN_I2S_BCLK=13
    -DPIN_I2S_WS=14
    -DPIN_I2S_DOUT=15
    -DPIN_PDM_OUT=16
    -DPIN_STATUS_LED=-1
    -DSTATUS_LED_INVERTED=0

; ---------------------------------------------------------------------------
; Same two boards with an HLK-LD2450 instead of the RD-03D (same wiring; check
; the module's own pin labels, its TX goes to the board's RX pin). See README.
; ---------------------------------------------------------------------------
[env:c3-supermini-ld2450]
extends = env:c3-supermini
build_flags =
    ${env:c3-supermini.build_flags}
    -DRADAR_LD2450=1

[env:s3-pico-ld2450]
extends = env:s3-pico
build_flags =
    ${env:s3-pico.build_flags}
    -DRADAR_LD2450=1

; ---------------------------------------------------------------------------
; Standalone bench test (see firmware/bench/README.md). Not the Blip app:
; a separate pass/fail firmware for checking a board before you wire it up.
; Also offered in the flasher as the "Bench test" card.
;   pio run -e c3-supermini-bench -t upload   (or s3-pico-bench)
; Same pins/board settings as the real app (inherited via extends), just a
; different source file.
; ---------------------------------------------------------------------------
[env:c3-supermini-bench]
extends = env:c3-supermini
build_src_filter = +<*> -<main.cpp> +<../bench/bench_main.cpp>

[env:s3-pico-bench]
extends = env:s3-pico
build_src_filter = +<*> -<main.cpp> +<../bench/bench_main.cpp>
