name: Bug report
description: Something is broken (expected in a -wip release, still worth telling)
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Blip version, description: From the About tab or the serial monitor banner, placeholder: 0.1.0-wip }
    validations: { required: true }
  - type: dropdown
    id: board
    attributes: { label: Board, options: [ESP32-C3 Super Mini, Waveshare ESP32-S3-Pico, Simulator (no hardware), Other] }
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: Phone / browser and PC OS, placeholder: "Android 9 Chrome; Linux Mint 22" }
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did, what you expected, what you saw }
    validations: { required: true }
  - type: textarea
    id: log
    attributes: { label: Serial monitor output / compile errors / /api/status JSON, render: text }
